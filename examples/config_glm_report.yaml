build_config: config_glm.yaml

features:
  spec_path: ../specs/feature_spec.csv
  scenario_column: report_demo

chart:
  expected: glm_prediction
  expected_label: GLM prediction
  expected_source: glm

# A blank chart_* value in feature_spec.csv falls back to these values.
chart_defaults:
  banding: 0
  quantiles: 0
  low_weights: 0
  missings: show
  labels: none
  sort: alpha
  transform: none
  sigma: 0
  date_bucket: none
  empty_periods: show

reports:
  - name: validation_actual_vs_expected
    title: External GLM - validation Actual vs Expected
    sample_values: [validation]
    chart_content: actual_expected
    partial_dependence: glm
    transform: none
    sigma: 2
    show_feature_importance: true
    sort_by_feature_importance: false

output:
  directory: ../local/external_reports
  chart_height: 600

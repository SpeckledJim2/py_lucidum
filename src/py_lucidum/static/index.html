<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lucidum</title>
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <a class="mark-link" href="https://github.com/SpeckledJim2/py_lucidum" target="_blank" rel="noopener noreferrer" aria-label="Open py_lucidum on GitHub">
            <img class="mark" src="/favicon.ico" alt="" />
          </a>
          <span>lucidum</span>
        </div>
        <div class="layout-toggle-group">
          <button id="sidebarToggleBtn" class="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-controls="appSidebar" aria-expanded="true" title="Collapse sidebar">
            <span class="sidebar-toggle-icon" aria-hidden="true"></span>
          </button>
          <button id="filterFooterToggleBtn" class="footer-toggle" type="button" aria-label="Hide filter footer" aria-controls="filterFooter" aria-expanded="true" title="Hide filter footer">
            <span class="footer-toggle-icon" aria-hidden="true"></span>
          </button>
        </div>
        <div id="datasetMeta" class="meta">Loading dataset...</div>
        <div class="spacer"></div>
        <button id="reloadBtn" class="ghost">Reload</button>
        <button id="themeBtn" class="ghost theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A7.5 7.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"></path>
          </svg>
        </button>
        <button id="stopAppBtn" class="danger-action">Stop app</button>
      </header>

      <div class="shell">
        <aside id="appSidebar">
          <section id="toolSelectorSection" class="section tool-selector-section">
            <div class="tool-selector">
              <button id="profileTool" class="tool-option active" type="button" data-tool="column_profile" aria-label="Column profile" title="Column profile">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false"><path d="M4 5h16M4 12h16M4 19h16M8 5v14" /></svg>
                </span>
                <span class="tool-label">Column profile</span>
              </button>
              <button id="lineBarTool" class="tool-option" type="button" data-tool="line_bar" aria-label="Line and bar" title="Line and bar">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false"><path d="M4 19h16M7 16V9m5 7V5m5 11v-4M6 11l4-4 4 5 4-3" /></svg>
                </span>
                <span class="tool-label">Line and bar</span>
              </button>
              <button id="ukMapTool" class="tool-option" type="button" data-tool="uk_map" aria-label="UK mapping" title="UK mapping">
                <span class="tool-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false"><path d="M9 18l-5 2V6l5-2 6 2 5-2v14l-5 2-6-2Zm0 0V4m6 16V6" /></svg>
                </span>
                <span class="tool-label">UK mapping</span>
              </button>
            </div>
          </section>

          <section class="section sidebar-kpi-section hidden">
            <div class="kpi-header">
              <button id="kpiCollapseBtn" class="filter-collapse-toggle" type="button" aria-label="Collapse KPIs" aria-expanded="true" title="Collapse KPIs">
                <span class="filter-collapse-icon" aria-hidden="true"></span>
              </button>
              <h2>KPIs</h2>
              <span id="kpiSelectedMeta" class="kpi-selected-meta"></span>
            </div>
            <div class="kpi-controls">
              <div class="metric-row">
                <div id="actualMetricTitle" class="metric-title">Actual</div>
                <select id="actualNumerator"></select>
              </div>
              <div class="metric-row">
                <div id="weightMetricTitle" class="metric-title">Weight</div>
                <select id="denominator"></select>
              </div>
            </div>
            <div id="kpiSelect" class="feature-list kpi-list" role="listbox" aria-label="KPIs"></div>
          </section>

          <section class="section sidebar-filter-section filter-collapsed">
            <div id="sidebarFilterResizer" class="sidebar-filter-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize filter controls"></div>
            <div class="filter-header">
              <button id="filterCollapseBtn" class="filter-collapse-toggle" type="button" aria-label="Expand filter" aria-expanded="false" title="Expand filter">
                <span class="filter-collapse-icon" aria-hidden="true"></span>
              </button>
              <h2>FILTER</h2>
              <span id="filterRowMeta" class="filter-row-meta"></span>
              <button id="filterSidebarClearBtn" class="filter-action filter-sidebar-clear" type="button" title="Clear filter" aria-label="Clear filter">&times;</button>
            </div>
            <div class="filter-controls-row">
              <div class="segmented filter-selection-mode" data-control="filterSelectionMode" aria-label="Saved filter selection mode">
                <button data-value="single" class="active" type="button">Single</button>
                <button data-value="grouped" type="button">Grouped</button>
                <button data-value="multi" type="button">Multi</button>
              </div>
              <div class="segmented filter-operator" data-control="filterOperator" aria-label="Saved filter operator">
                <button data-value="and" class="active" type="button">All</button>
                <button data-value="or" type="button">Any</button>
                <button data-value="nand" type="button">Not all</button>
                <button data-value="nor" type="button">None</button>
              </div>
            </div>
            <div id="savedFilterSelect" class="feature-list saved-filter-list" role="listbox" aria-label="Saved filters" aria-multiselectable="true"></div>
          </section>
        </aside>

        <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>

        <main>
          <div id="lineBarToolbar" class="toolbar hidden">
            <div id="sortControl" class="control">
              <h3>x-axis sort order</h3>
              <div class="segmented" data-control="sort">
                <button data-value="alpha" class="active">A-Z</button>
                <button data-value="volume">Weight</button>
                <button data-value="actual">Actual</button>
                <button id="expectedSortButton" data-value="expected" class="hidden">Expected</button>
              </div>
            </div>
            <div class="control">
              <h3>Group low weights</h3>
              <div class="segmented" data-control="lowGroup">
                <button data-value="0" class="active">0</button>
                <button data-value="10">10</button>
                <button data-value="100">100</button>
                <button data-value="0.1%">0.1%</button>
                <button data-value="1%">1%</button>
              </div>
            </div>
            <div class="control">
              <h3>Labels</h3>
              <div class="segmented" data-control="labels">
                <button data-value="none" class="active">-</button>
                <button data-value="bar">Bar</button>
                <button data-value="line">Line</button>
                <button data-value="all">All</button>
              </div>
            </div>
            <div id="bandControl" class="control">
              <h3><span id="bandLabel">Banding</span> <span id="bandValue"></span></h3>
              <div class="segmented" data-control="bandWidth">
                <button data-action="band-down">&lt;</button>
                <button data-value="0" class="active">-</button>
                <button data-value="0.1">0.1</button>
                <button data-value="1">1</button>
                <button data-value="5">5</button>
                <button data-value="10">10</button>
                <button data-action="band-up">&gt;</button>
              </div>
            </div>
            <div id="quantileControl" class="control">
              <h3>Quantile</h3>
              <div class="segmented" data-control="quantileMode">
                <button data-value="off" class="active">-</button>
                <button data-value="quantile">Use quantiles</button>
              </div>
            </div>
            <div id="dateControl" class="control">
              <h3>Date bucket</h3>
              <div class="segmented" data-control="dateBucket">
                <button data-value="none" class="active">-</button>
                <button data-value="hour">Hour</button>
                <button data-value="day">Day</button>
                <button data-value="week">Week</button>
                <button data-value="month">Month</button>
                <button data-value="year">Year</button>
              </div>
            </div>
            <div class="control">
              <h3>Response transform</h3>
              <div class="segmented" data-control="transform">
                <button data-value="none" class="active">-</button>
                <button data-value="log">Log</button>
                <button data-value="exp">Exp</button>
                <button data-value="logit">Logit</button>
                <button data-value="zero">0</button>
                <button data-value="one">1</button>
              </div>
            </div>
            <div class="control">
              <h3>Sigma bars</h3>
              <div class="segmented" data-control="sigma">
                <button data-value="0" class="active">-</button>
                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="5">5</button>
              </div>
            </div>
          </div>
          <div id="status" class="status main-status hidden"></div>

          <div id="visualArea" class="visual-area profile-mode">
            <div id="chartSideControls" class="chart-side-controls hidden">
              <section class="chart-side-section feature-section">
                <div class="section-title-row">
                  <h2>x-axis feature</h2>
                  <div class="segmented" data-control="featureSort">
                    <button data-value="original" class="active">Original</button>
                    <button data-value="alpha">A-Z</button>
                  </div>
                </div>
                <div class="chart-search-row">
                  <input id="featureSearch" class="search" placeholder="search" />
                  <button id="featureSearchClear" class="filter-action" type="button" title="Clear x-axis feature search" aria-label="Clear x-axis feature search">&times;</button>
                </div>
                <div id="featureList" class="feature-list"></div>
              </section>

              <div id="chartControlHeightResizer" class="chart-control-height-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize x-axis and expected controls"></div>

              <section class="chart-side-section">
                <div class="section-title-row">
                  <h2 id="expectedMetricTitle" class="metric-title">Expected</h2>
                  <div class="segmented" data-control="expectedSort">
                    <button data-value="original" class="active">Original</button>
                    <button data-value="alpha">A-Z</button>
                  </div>
                </div>
                <select id="expectedNumerator" class="hidden" aria-hidden="true" tabindex="-1"></select>
                <div class="chart-search-row">
                  <input id="expectedSearch" class="search" placeholder="search" />
                  <button id="expectedSearchClear" class="filter-action" type="button" title="Clear Expected search" aria-label="Clear Expected search">&times;</button>
                </div>
                <div id="expectedList" class="feature-list"></div>
              </section>
            </div>

            <div id="chartControlsResizer" class="chart-controls-resizer hidden" role="separator" aria-orientation="vertical" aria-label="Resize chart controls"></div>

            <section class="workspace">
              <div id="lineBarTabs" class="tabs workspace-tabs hidden">
                <button id="chartTab" class="tab active">Chart</button>
                <button id="tableTab" class="tab">Table</button>
              </div>
              <div class="workspace-messages">
                <div id="profileGroupMeta" class="workspace-meta"></div>
                <div id="profileFilter">no filter</div>
                <div id="lineBarGroupMeta" class="workspace-meta hidden"></div>
                <div id="lineBarFilter" class="hidden">no filter</div>
                <div id="chartMessage" class="chart-message hidden"></div>
              </div>
              <div id="chart" class="hidden"></div>
              <div id="tableWrap" class="table-wrap hidden"></div>
              <div id="profileWrap" class="profile-wrap"></div>
              <div id="ukMap" class="uk-map hidden"></div>
              <div id="mapFloatingControl" class="map-floating-control hidden">
                <div class="map-floating-header">
                  <strong id="mapControlMetric">Actual</strong>
                  <div id="mapGroupMeta" class="workspace-meta"></div>
                  <span id="mapControlFilter">no filter</span>
                  <button id="mapControlReset" class="map-control-reset" type="button" title="Reset map controls position" aria-label="Reset map controls position">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7"></path><path d="M10 7h7v7"></path></svg>
                  </button>
                </div>
                <div class="map-floating-row">
                  <div class="postcode-search">
                    <input id="mapPostcodeInput" placeholder="postcode..." />
                    <button id="mapPostcodeClear" type="button" title="Clear postcode" aria-label="Clear postcode">&times;</button>
                    <button id="mapPostcodeSearch" type="button" title="Search postcode" aria-label="Search postcode">
                      <svg viewBox="0 0 24 24" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
                    </button>
                  </div>
                  <div class="map-palette-buttons" aria-label="Choropleth colour scheme">
                    <button class="map-palette-button active" type="button" data-palette="divergent" title="Divergent">
                      <span class="palette-swatch palette-divergent"></span>
                    </button>
                    <button class="map-palette-button" type="button" data-palette="spectral" title="Spectral">
                      <span class="palette-swatch palette-spectral"></span>
                    </button>
                    <button class="map-palette-button" type="button" data-palette="viridis" title="Viridis">
                      <span class="palette-swatch palette-viridis"></span>
                    </button>
                  </div>
                </div>
                <div class="map-slider-grid">
                  <label class="map-slider-control">
                    <span>Line</span>
                    <span class="slider-scale"><b>0</b><b id="mapLineWeightValue">1</b><b>5</b></span>
                    <input id="mapLineWeight" type="range" min="0" max="5" step="1" value="1" />
                  </label>
                  <label class="map-slider-control">
                    <span>Opacity</span>
                    <span class="slider-scale"><b>0</b><b id="mapOpacityValue">1</b><b>1</b></span>
                    <input id="mapOpacity" type="range" min="0" max="1" step="0.2" value="1" />
                  </label>
                  <label class="map-slider-control">
                    <span>Extremes</span>
                    <span class="slider-scale"><b>-10%</b><b id="mapHotspotsValue">0</b><b>10%</b></span>
                    <input id="mapHotspots" type="range" min="-0.1" max="0.1" step="0.01" value="0" />
                  </label>
                  <label class="map-slider-control">
                    <span>Labels</span>
                    <span class="slider-scale"><b>0</b><b id="mapLabelSizeValue">0</b><b>20</b></span>
                    <input id="mapLabelSize" type="range" min="0" max="20" step="1" value="0" />
                  </label>
                </div>
              </div>
              <div id="mapLegend" class="map-legend hidden"></div>
            </section>
          </div>
        </main>
      </div>
      <footer id="filterFooter" class="filter-footer">
        <div class="footer-filter-controls">
          <button id="filterClearBtn" class="filter-action" type="button" title="Clear filter" aria-label="Clear filter">&times;</button>
          <button id="filterApplyBtn" class="filter-action" type="button" title="Apply filter" aria-label="Apply filter">&#9654;</button>
          <input id="filterInput" placeholder="DuckDB WHERE expression" />
        </div>
        <div id="actionTimingMonitor" class="action-timing-monitor" aria-live="polite">DuckDB: --, Profile render: --</div>
      </footer>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>

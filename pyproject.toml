[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-lucidum"
version = "0.2.13"
description = "Interactive data exploration workbench for local CSV files, Parquet files, and same-schema Parquet folders."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "psutil>=5.9",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/SpeckledJim2/py_lucidum#readme"
Repository = "https://github.com/SpeckledJim2/py_lucidum"
Issues = "https://github.com/SpeckledJim2/py_lucidum/issues"

[project.optional-dependencies]
gbm = [
  "lightgbm>=4.0",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
]
glm = [
  "glum>=3.4",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
]

[project.scripts]
lucidum = "py_lucidum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_lucidum"]

[tool.hatch.build.targets.wheel.force-include]
"datasets/motor_premiums.parquet" = "py_lucidum/datasets/motor_premiums.parquet"
"favicon.ico" = "py_lucidum/static/favicon.ico"

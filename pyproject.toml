[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-lucidum"
version = "0.5.28"
description = "Interactive data exploration workbench for local CSV files, Parquet files, and same-schema Parquet folders."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "psutil>=5.9",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/SpeckledJim2/py_lucidum#readme"
Repository = "https://github.com/SpeckledJim2/py_lucidum"
Issues = "https://github.com/SpeckledJim2/py_lucidum/issues"

[project.optional-dependencies]
examples = [
  "PyYAML>=6.0",
]
gbm = [
  "cffi>=1.17.1",
  "lightgbm[arrow]>=4.0",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "polars[pyarrow]>=1.0",
]
glm = [
  "glum>=3.4",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "polars[pyarrow]>=1.0",
]

[project.scripts]
lucidum = "py_lucidum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_lucidum"]

[tool.hatch.build.targets.wheel.force-include]
"datasets/motor_premiums.parquet" = "py_lucidum/datasets/motor_premiums.parquet"
"specs/filter_spec.csv" = "py_lucidum/specs/filter_spec.csv"
"specs/kpi_spec.csv" = "py_lucidum/specs/kpi_spec.csv"
"specs/feature_spec.csv" = "py_lucidum/specs/feature_spec.csv"
"favicon.ico" = "py_lucidum/static/favicon.ico"
"examples/01_external_gbm_artifacts_demo.py" = "py_lucidum/example_workflows/01_external_gbm_artifacts_demo.py"
"examples/01_external_glm_artifacts_demo.py" = "py_lucidum/example_workflows/01_external_glm_artifacts_demo.py"
"examples/02_external_gbm_report_demo.py" = "py_lucidum/example_workflows/02_external_gbm_report_demo.py"
"examples/02_external_glm_report_demo.py" = "py_lucidum/example_workflows/02_external_glm_report_demo.py"
"examples/03_external_gbm_summary_report_demo.py" = "py_lucidum/example_workflows/03_external_gbm_summary_report_demo.py"
"examples/03_external_glm_summary_report_demo.py" = "py_lucidum/example_workflows/03_external_glm_summary_report_demo.py"
"examples/04_external_double_lift_demo.py" = "py_lucidum/example_workflows/04_external_double_lift_demo.py"
"examples/external_model_helpers.py" = "py_lucidum/example_workflows/external_model_helpers.py"
"examples/external_model_results.py" = "py_lucidum/example_workflows/external_model_results.py"
"examples/external_report_helpers.py" = "py_lucidum/example_workflows/external_report_helpers.py"
"examples/lucidum_install.py" = "py_lucidum/example_workflows/lucidum_install.py"
